[package]
name = "niuva-sonic"
version = "0.2.0"
description = "Navidrome-Client fuer Windows"
license = "Apache-2.0"
repository = "https://github.com/foxy221/niuva-sonic"
authors = ["foxy221"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "niuva_sonic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Das Tray-Symbol ist eine Windows-Sache; `image-png` dekodiert das Symbolbild.
# `protocol-asset` gehoert zum aktivierten Asset-Protokoll fuer lokale Dateien.
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `stream` schaltet den Reexport von reqwest fuer Chunk-Downloads frei.
tauri-plugin-http = { version = "2", features = ["stream"] }
tauri-plugin-store = "2"
# Chunk-Downloads in die Offline-Ablage; die Laufzeit bringt Tauri mit.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["fs", "io-util"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
# Zweite Instanz meldet sich bei der laufenden und beendet sich.
tauri-plugin-single-instance = "2"
# Fenstergroesse, -position und Maximierung ueber den Neustart.
tauri-plugin-window-state = "2"
# Medientasten systemweit, in den Einstellungen abschaltbar.
tauri-plugin-global-shortcut = "2"

# Auto-Update nur auf dem Desktop; die Einrichtung steht in docs/ROADMAP-Technik.md.
tauri-plugin-updater = "2"

# Zugangsdaten liegen in der Windows-Anmeldeinformationsverwaltung statt im
# Klartext-Store der Oberflaeche. Nur Windows; auf anderen Systemen sagt der
# Befehl ab und die Oberflaeche faellt auf die alte Ablage zurueck.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
