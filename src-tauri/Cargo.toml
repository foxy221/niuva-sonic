[package]
name = "niuva-sonic"
version = "0.1.0"
description = "Navidrome-Client fuer Windows und Android"
authors = ["foxy221"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "niuva_sonic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Das Tray-Symbol ist eine Windows-Sache; `image-png` dekodiert das Symbolbild.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-http = "2"
tauri-plugin-store = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
# Zweite Instanz meldet sich bei der laufenden und beendet sich.
tauri-plugin-single-instance = "2"
# Fenstergroesse, -position und Maximierung ueber den Neustart.
tauri-plugin-window-state = "2"
# Medientasten systemweit, in den Einstellungen abschaltbar.
tauri-plugin-global-shortcut = "2"

# Auto-Update nur auf dem Desktop; die Einrichtung steht in docs/ROADMAP-Technik.md.
tauri-plugin-updater = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
